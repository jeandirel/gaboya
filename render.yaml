services:
  - type: web
    name: gaboya-api-dev
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: backend
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.lock
    startCommand: python -m alembic upgrade head && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /readyz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: development
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SMS_PROVIDER
        value: disabled
      - key: PAWAPAY_MODE
        value: disabled
