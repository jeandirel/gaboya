services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: gaboya
      POSTGRES_DB: gaboya_test
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local test password in your shell}
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - gaboya-test-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gaboya -d gaboya_test']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  gaboya-test-data:
