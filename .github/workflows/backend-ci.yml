name: Backend checks
on:
  push:
    branches: [main, 'integration/**']
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'render.yaml']
  pull_request:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml', 'render.yaml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gaboya_test
          POSTGRES_USER: gaboya
          POSTGRES_PASSWORD: ci-only-local-postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gaboya -d gaboya_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://gaboya:ci-only-local-postgres@127.0.0.1:5432/gaboya_test
      APP_ENV: test
      APP_SECRET: ci-only-synthetic-secret-never-use-in-production-123456
      SMS_PROVIDER: test
      ALLOW_TEST_SMS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: pip install -r requirements.lock
      - name: Compile Python source
        run: python -m compileall -q app migrations tests
      - name: Apply PostgreSQL migrations
        run: python -m alembic upgrade head
      - name: Check model drift
        run: python -m alembic check
      - name: Run API and concurrency tests
        run: python -m pytest -q
