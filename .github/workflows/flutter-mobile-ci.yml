name: Flutter mobile validation
on:
  push:
    branches:
      - 'integration/flutterflow-mobile-*'
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-mobile-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter SDK
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter tests
        run: flutter test
      - name: Build web preview
        run: flutter build web --release
